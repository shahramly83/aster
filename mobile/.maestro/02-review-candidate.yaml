# [POSITIVE] Manager reviews a candidate: Positions -> a role -> a candidate ->
# the profile tabs. Skips gracefully if the demo workspace has no open roles.
appId: com.hireaster.mobile
tags:
  - suite
  - hiring
  - positive
---
- launchApp
- runFlow: subflows/login.yaml

# Go to the Positions tab (icon-only when inactive; tap by its label if focused,
# else tap the briefcase icon by its accessibility/position).
- tapOn:
    text: "Positions"
    optional: true
- extendedWaitUntil:
    visible: "OPEN POSITIONS.*"
    timeout: 20000

# Open the first role card. If there are none, the empty state shows instead.
- runFlow:
    when:
      notVisible: "No open positions"
    commands:
      # "View" is the button on a ROLE card; it opens the job.
      - tapOn:
          text: "View"
          index: 0

      # Job detail: hero stats and the AI Rank bar.
      - extendedWaitUntil:
          visible: "AI Rank"
          timeout: 20000
      # "TO REVIEW" was renamed out of the app at some point and this assertion
      # was never updated, so it could only ever fail. "AI Rank" above already
      # proves we are on the job detail screen.

      # Open the first candidate.
      - tapOn:
          text: "Open candidate.*"
          index: 0
      # Candidate profile sub-tabs.
      - extendedWaitUntil:
          visible: "Profile"
          timeout: 20000
      - assertVisible: "Interview"
