# [POSITIVE] Open Settings from the header gear, verify the preference toggles,
# then sign out — which returns to the auth screen.
appId: com.hireaster.mobile
tags:
  - suite
  - settings
  - positive
---
- launchApp
- runFlow: subflows/login.yaml

# The gear is an icon-only control in the blue header, left of the bell.
- tapOn: "Settings"
# Not "Settings": naming the gear button "Settings" for screen readers means that
# string is on screen before the sheet opens, so waiting for it would prove
# nothing. PREFERENCES only exists inside the sheet.
- extendedWaitUntil:
    visible: "PREFERENCES"
    timeout: 15000
- assertVisible: "PREFERENCES"
- assertVisible: "Biometric unlock"
- assertVisible: "Notifications"
- scrollUntilVisible:
    element:
      text: "Aster · v.*"
    direction: DOWN
    timeout: 10000

# Sign out returns to the sign-in screen.
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "WORK EMAIL"
    timeout: 20000
